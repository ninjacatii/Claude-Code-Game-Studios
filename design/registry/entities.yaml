    output_range: [1, 1000000]
    expression: "clamp(N + 1, deal_number_min, deal_number_max)"
    notes: "AT_LIMIT when the target equals the current N; no wraparound."
    added: 2026-10-24
    revised: ""

  - name: previous_deal
    status: active
    source: design/gdd/game-state-machine.md
