    output_range: [0, 1]
    expression: "1 if game_completion(model) = 0 and hint_candidate_count(model) > 0, else 0"
    added: 2026-10-24
    revised: ""

  - name: win_rate
    status: active
    source: design/gdd/statistics-records.md
    referenced_by:
      - design/gdd/statistics-records.md
      - design/gdd/toolbar-menus.md
    variables:
      - games_played
      - games_won
    output_range: [0, 1]
    expression: "0 if games_played = 0 else games_won / games_played"
    notes: "Derived, never stored; real division (float64); UI formats as percentage."
    added: 2026-10-24
    revised: ""

