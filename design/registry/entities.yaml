    variables:
      - previous_cursor
      - candidate_count
      - same_candidate_list
    output_range: [-1, 767]
    expression: "-1 if candidate_count = 0; 0 if same_candidate_list = 0; (previous_cursor + 1) mod candidate_count otherwise"
    added: 2026-10-24
    revised: ""

  - name: hint_available
    status: active
    source: design/gdd/hint-system.md
    referenced_by:
