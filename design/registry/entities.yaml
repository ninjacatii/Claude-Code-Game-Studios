    added: 2026-10-24
    revised: ""

  - name: hint_tier
    status: active
    source: design/gdd/hint-system.md
    referenced_by:
      - design/gdd/hint-system.md
    variables:
      - move
      - model
    output_range: [0, 5]
    expression: "0 if source tableau -> empty tableau and count = height(source); else 1 if destination foundation; else 2 if source tableau -> non-empty tableau and count = height(source); else 3 if source free_cell -> non-empty tableau; else 4 if source tableau -> non-empty tableau and count < height(source); else 5"
    notes: "0 = excluded pure column permutation; 1-5 = priority tiers. Ties resolved by enumeration_index."
    added: 2026-10-24
    revised: ""

  - name: hint_ranked_moves
    status: active
    source: design/gdd/hint-system.md
    referenced_by:
      - design/gdd/hint-system.md
    variables:
      - model
    output_range: [0, 768]
    expression: "sort_ascending([m for m in legal_moves(model) if hint_tier(m, model) > 0], key=(hint_tier, enumeration_index))"
    notes: "Output is Move[]; output_range is its length. enumeration_index is the 0-based index in the unfiltered legal_moves list."
    added: 2026-10-24
    revised: ""

  - name: hint_candidate_count
    status: active
    source: design/gdd/hint-system.md
    referenced_by:
