    variables:
      - model
    output_range: [0, 768]
    expression: "|hint_ranked_moves(model)|"
    notes: "Distinct from legal_move_count; smaller when pure column permutations are excluded."
    added: 2026-10-24
    revised: ""

  - name: hint_cycle_index
    status: active
    source: design/gdd/hint-system.md
    referenced_by:
