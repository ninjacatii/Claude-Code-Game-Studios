    added: 2026-10-24
    revised: ""

  - name: supermove_capacity
    status: active
    source: design/gdd/rules-move-validator.md
    referenced_by:
      - design/gdd/rules-move-validator.md
    variables:
      - F
      - E
      - destination_empty
    output_range: [1, 1280]
